<!--
  Grabados de tema.

  Trazo fino, sin relleno, tramado igual que la luna. Cada tema es un dibujo
  distinto dentro del mismo viewBox (-50..50) para que el grosor de linea
  coincida con el de la luna.

  Son decorativos: no describen la respuesta del visitante, solo el tema de la
  pregunta. Por eso van marcados como aria-hidden.
-->
<svg
  class="etch-svg"
  viewBox="-50 -50 100 100"
  aria-hidden="true"
  focusable="false"
>
  <defs>
    <pattern [attr.id]="hatchId" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(38)">
      <line x1="0" y1="0" x2="0" y2="4" class="hatch-line" />
    </pattern>
  </defs>

  @switch (theme()) {

    <!-- SUFICIENCIA: el horizonte quieto. No hay nada que cruzar. -->
    @case ('suficiencia') {
      <g>
        <line x1="-44" y1="18" x2="44" y2="18" class="ground" />
        <line x1="-44" y1="20" x2="44" y2="20" class="faint" />
        <path d="M -30 18 A 30 30 0 0 1 10 18" class="ground" />
        <path d="M -30 18 A 30 30 0 0 0 10 18" class="faint" />
        <circle cx="26" cy="6" r="9" class="limb" />
        <line x1="26" y1="-3" x2="26" y2="18" class="faint" />
      </g>
    }

    <!-- IDENTIDAD: dos contornos que no encajan. -->
    @case ('identidad') {
      <g>
        <circle cx="-12" cy="0" r="20" class="limb" />
        <circle cx="12" cy="0" r="20" class="faint" />
        <path d="M -12 -20 A 20 20 0 0 1 -12 20" class="ground" />
        <path d="M 12 -20 A 20 20 0 0 1 12 20" class="ground" />
        <line x1="-4" y1="-14" x2="-4" y2="14" class="faint" />
        <line x1="4" y1="-14" x2="4" y2="14" class="faint" />
      </g>
    }

    <!-- PODER: el peso de algo que se sostiene. -->
    @case ('poder') {
      <g>
        <circle cx="0" cy="-4" r="13" class="limb" />
        <path d="M 0 9 L 0 30" class="ground" />
        <path d="M 0 18 L -16 30" class="limb" />
        <path d="M 0 18 L 16 30" class="limb" />
        <path d="M -18 38 L 18 38" class="ground" />
        <path d="M -18 40 L 18 40" class="faint" />
        <circle cx="0" cy="-4" r="20" class="faint" />
      </g>
    }

    <!-- SACRIFICIO: algo que se entrega y no vuelve. -->
    @case ('sacrificio') {
      <g>
        <path d="M 0 -26 C 10 -10, 10 10, 0 26" class="ground" />
        <path d="M 0 -26 C -10 -10, -10 10, 0 26" class="faint" />
        <path d="M 0 -26 L 0 26" class="limb" />
        <line x1="-26" y1="34" x2="26" y2="34" class="ground" />
        <path d="M -14 12 L 0 26 L 14 12" class="faint" />
      </g>
    }

    <!-- MIEDO: lo que se ve antes que lo que se piensa. -->
    @case ('miedo') {
      <g>
        <path d="M -30 20 C -20 -6, 20 -6, 30 20" class="ground" />
        <line x1="-30" y1="20" x2="30" y2="20" class="faint" />
        <circle cx="0" cy="-16" r="8" class="limb" />
        <line x1="-9" y1="-16" x2="-4" y2="-16" class="ground" />
        <line x1="4" y1="-16" x2="9" y2="-16" class="ground" />
        <line x1="-20" y1="6" x2="-14" y2="2" class="faint" />
        <line x1="20" y1="6" x2="14" y2="2" class="faint" />
      </g>
    }

    <!-- VINCULO: dos figures unidas por un hilo. -->
    @case ('vinculo') {
      <g>
        <circle cx="-20" cy="-6" r="7" class="limb" />
        <circle cx="20" cy="-6" r="7" class="limb" />
        <path d="M -20 1 L -20 30" class="ground" />
        <path d="M 20 1 L 20 30" class="ground" />
        <path d="M -13 -2 C -4 8, 4 8, 13 -2" class="faint" />
        <path d="M -13 4 C -4 14, 4 14, 13 4" class="faint" />
      </g>
    }

    <!-- CONFLICTO: dos fuerzas en el mismo punto. -->
    @case ('conflicto') {
      <g>
        <line x1="-34" y1="-24" x2="-4" y2="4" class="ground" />
        <line x1="34" y1="-24" x2="4" y2="4" class="ground" />
        <line x1="-34" y1="24" x2="-4" y2="-4" class="faint" />
        <line x1="34" y1="24" x2="4" y2="-4" class="faint" />
        <circle cx="0" cy="0" r="9" class="limb" />
        <circle cx="0" cy="0" r="20" class="faint" />
      </g>
    }

    <!-- PERTENENCIA: varios dentro de un mismo círculo. -->
    @case ('pertenencia') {
      <g>
        <circle cx="0" cy="0" r="30" class="ground" />
        <circle cx="-13" cy="0" r="5" class="limb" />
        <circle cx="13" cy="0" r="5" class="limb" />
        <circle cx="0" cy="-15" r="5" class="limb" />
        <circle cx="0" cy="15" r="5" class="limb" />
        <circle cx="0" cy="0" r="38" class="faint" />
      </g>
    }

    <!-- SABIDURIA: el ojo que calcula antes de actuar. -->
    @case ('sabiduria') {
      <g>
        <path d="M -32 0 C -18 -18, 18 -18, 32 0" class="ground" />
        <path d="M -32 0 C -18 18, 18 18, 32 0" class="faint" />
        <circle cx="0" cy="0" r="10" class="ground" />
        <circle cx="0" cy="0" r="4" class="limb" />
        <line x1="-40" y1="30" x2="40" y2="30" class="faint" />
      </g>
    }

    <!-- TIEMPO: lo que se va y lo que queda. -->
    @case ('tiempo') {
      <g>
        <circle cx="0" cy="0" r="26" class="limb" />
        <circle cx="0" cy="0" r="26" class="faint" stroke-dasharray="3 4" />
        <line x1="0" y1="0" x2="0" y2="-26" class="ground" />
        <line x1="0" y1="0" x2="18" y2="12" class="ground" />
        <line x1="-38" y1="26" x2="38" y2="26" class="faint" />
      </g>
    }

    <!-- PROYECCION: el camino abierto hacia delante. -->
    @case ('proyeccion') {
      <g>
        <path d="M -32 34 L -8 6 L 4 20 L 32 -18" class="ground" />
        <path d="M -32 38 L -8 10 L 4 24 L 32 -14" class="faint" />
        <circle cx="32" cy="-16" r="6" class="ground" />
        <circle cx="32" cy="-16" r="16" class="faint" />
        <line x1="-40" y1="42" x2="40" y2="42" class="faint" />
      </g>
    }

    <!-- ESPEJO: alguien te devuelve la mirada. -->
    @case ('espejo') {
      <g>
        <path d="M -22 -26 C -6 -26, 6 -14, 6 0 C 6 14, -6 26, -22 26" class="ground" />
        <path d="M 22 -26 C 6 -26, -6 -14, -6 0 C -6 14, 6 26, 22 26" class="faint" />
        <line x1="0" y1="-26" x2="0" y2="26" class="faint" />
        <circle cx="-16" cy="0" r="3" class="limb" />
        <circle cx="16" cy="0" r="3" class="limb" />
      </g>
    }

    <!-- SUJETO: una figura sola en el centro. -->
    @case ('sujeto') {
      <g>
        <circle cx="0" cy="-18" r="9" class="limb" />
        <path d="M 0 -9 L 0 16" class="ground" />
        <path d="M -16 -2 L 0 -9 L 16 -2" class="faint" />
        <path d="M 0 16 L -13 38" class="ground" />
        <path d="M 0 16 L 13 38" class="ground" />
        <line x1="-30" y1="40" x2="30" y2="40" class="faint" />
      </g>
    }

    <!-- PROPOSITO: el punto hacia donde se apunta. -->
    @case ('proposito') {
      <g>
        <circle cx="0" cy="0" r="6" class="ground" />
        <circle cx="0" cy="0" r="14" class="faint" />
        <circle cx="0" cy="0" r="24" class="faint" />
        <circle cx="0" cy="0" r="36" class="faint" />
        <line x1="0" y1="-38" x2="0" y2="-14" class="ground" />
      </g>
    }
  }
</svg>
