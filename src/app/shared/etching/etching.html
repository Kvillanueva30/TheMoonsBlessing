<!--
  Grabados de tema por escena, estilo grabado.

  Cada escena es un SVG independiente en public/etchings/, con el mismo
  lenguaje visual que la luna: trazos finos, tramado y dorados.
-->
<img
  class="etch-svg"
  [src]="'/etchings/' + theme() + '.svg'"
  [alt]="theme()"
  aria-hidden="true"
/>
