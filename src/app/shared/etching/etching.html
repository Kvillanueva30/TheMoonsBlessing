<!--
  Grabados de tema por escena, estilo grabado.

  Cada escena es un dibujo distinto dentro del mismo viewBox para que el peso
  de linea sea consistente con la luna.
-->
<svg
  class="etch-svg"
  viewBox="0 0 200 140"
  aria-hidden="true"
  focusable="false"
>
  <defs>
    <pattern [attr.id]="hatchId" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="4" stroke="#d4af37" stroke-width="0.6" />
    </pattern>
  </defs>

  @switch (theme()) {
    @case ('barca') {
      <g>
        <rect width="200" height="140" fill="#0a0c14" />
        <circle cx="100" cy="46" r="20" fill="none" stroke="#f3d28c" stroke-width="1.2" />
        <path d="M88 36 a4 4 0 0 1 4 4 M108 54 a3 3 0 0 1 3 3" fill="none" stroke="#d4af37" stroke-width="1" />
        <path d="M0 96 L40 70 L80 92 L120 72 L160 94 L200 76" fill="none" stroke="#9a8f74" stroke-width="1.2" />
        <path d="M0 110 L50 88 L100 106 L150 90 L200 108" fill="none" stroke="#6a614c" stroke-width="1" />
        <rect y="104" width="200" height="36" [attr.fill]="'url(#' + hatchId + ')'" opacity="0.5" />
        <path d="M62 118 Q 74 110 100 110 Q 126 110 138 118 L 130 128 L 70 128 Z" fill="none" stroke="#d4af37" stroke-width="1.4" />
        <path d="M100 110 L 100 78" stroke="#d4af37" stroke-width="1.6" />
        <path d="M100 78 L 124 106 L 100 106 Z" fill="none" stroke="#f3d28c" stroke-width="1.2" />
      </g>
    }

    @case ('extranjero') {
      <g>
        <rect width="200" height="140" fill="#0a0c14" />
        <path d="M70 16 L70 140 M130 16 L130 140" fill="none" stroke="#9a8f74" stroke-width="1.4" />
        <path d="M70 16 Q 100 4, 130 16" fill="none" stroke="#9a8f74" stroke-width="1.2" />
        <circle cx="100" cy="56" r="10" fill="none" stroke="#f3d28c" stroke-width="1.4" />
        <path d="M100 66 L 100 110" fill="none" stroke="#f3d28c" stroke-width="1.4" />
        <path d="M88 78 L 100 68 L 112 78" fill="none" stroke="#d4af37" stroke-width="1.2" />
        <path d="M100 110 L 88 134 M100 110 L 112 134" fill="none" stroke="#f3d28c" stroke-width="1.2" />
        <rect y="112" width="200" height="28" [attr.fill]="'url(#' + hatchId + ')'" opacity="0.4" />
      </g>
    }

    @case ('juicio') {
      <g>
        <rect width="200" height="140" fill="#0a0c14" />
        <line x1="100" y1="24" x2="100" y2="104" stroke="#f3d28c" stroke-width="1.6" />
        <path d="M84 104 L 116 104" stroke="#f3d28c" stroke-width="1.6" />
        <path d="M84 24 L 116 24" stroke="#d4af37" stroke-width="1.4" />
        <path d="M84 24 L 70 56 L 98 56 Z" fill="none" stroke="#f3d28c" stroke-width="1.2" />
        <path d="M116 24 L 102 56 L 130 56 Z" fill="none" stroke="#f3d28c" stroke-width="1.2" />
        <line x1="70" y1="56" x2="98" y2="56" stroke="#f3d28c" stroke-width="1.2" />
        <line x1="102" y1="56" x2="130" y2="56" stroke="#f3d28c" stroke-width="1.2" />
        <rect y="116" width="200" height="24" [attr.fill]="'url(#' + hatchId + ')'" opacity="0.4" />
      </g>
    }

    @case ('camara') {
      <g>
        <rect width="200" height="140" fill="#0a0c14" />
        <rect x="50" y="30" width="100" height="80" fill="none" stroke="#f3d28c" stroke-width="1.4" />
        <rect x="62" y="42" width="76" height="56" fill="none" stroke="#d4af37" stroke-width="1" />
        <line x1="100" y1="42" x2="100" y2="98" stroke="#9a8f74" stroke-width="1" />
        <line x1="62" y1="70" x2="138" y2="70" stroke="#9a8f74" stroke-width="1" />
        <circle cx="100" cy="70" r="7" fill="none" stroke="#f3d28c" stroke-width="1.2" />
        <rect y="110" width="200" height="30" [attr.fill]="'url(#' + hatchId + ')'" opacity="0.4" />
      </g>
    }

    @case ('verdad') {
      <g>
        <rect width="200" height="140" fill="#0a0c14" />
        <path d="M30 70 C 60 44, 140 44, 170 70" fill="none" stroke="#f3d28c" stroke-width="1.6" />
        <path d="M30 70 C 60 96, 140 96, 170 70" fill="none" stroke="#d4af37" stroke-width="1.4" />
        <circle cx="100" cy="70" r="12" fill="none" stroke="#f3d28c" stroke-width="1.4" />
        <path d="M60 40 L 76 56 M140 40 L 124 56" stroke="#9a8f74" stroke-width="1.2" />
        <rect y="104" width="200" height="36" [attr.fill]="'url(#' + hatchId + ')'" opacity="0.4" />
      </g>
    }

    @case ('deseo') {
      <g>
        <rect width="200" height="140" fill="#0a0c14" />
        <path d="M100 24 L 112 58 L 148 58 L 119 80 L 133 116 L 100 94 L 67 116 L 81 80 L 52 58 L 88 58 Z" fill="none" stroke="#f3d28c" stroke-width="1.4" />
        <path d="M100 40 L 106 60 L 126 60 L 110 72 L 116 92 L 100 80 L 84 92 L 90 72 L 74 60 L 94 60 Z" fill="none" stroke="#d4af37" stroke-width="1" />
        <rect y="116" width="200" height="24" [attr.fill]="'url(#' + hatchId + ')'" opacity="0.4" />
      </g>
    }

    @case ('quieres-o-necesitas') {
      <g>
        <rect width="200" height="140" fill="#0a0c14" />
        <path d="M30 110 Q 60 40, 100 66" fill="none" stroke="#f3d28c" stroke-width="1.6" />
        <path d="M170 110 Q 140 40, 100 66" fill="none" stroke="#d4af37" stroke-width="1.4" />
        <circle cx="100" cy="66" r="10" fill="none" stroke="#f3d28c" stroke-width="1.4" />
        <path d="M30 110 L 30 134 M170 110 L 170 134" fill="none" stroke="#9a8f74" stroke-width="1.2" />
        <rect y="116" width="200" height="24" [attr.fill]="'url(#' + hatchId + ')'" opacity="0.4" />
      </g>
    }

    @case ('ventaja') {
      <g>
        <rect width="200" height="140" fill="#0a0c14" />
        <rect x="50" y="50" width="100" height="56" fill="none" stroke="#f3d28c" stroke-width="1.4" />
        <path d="M50 50 L 100 26 L 150 50" fill="none" stroke="#d4af37" stroke-width="1.4" />
        <path d="M50 106 L 100 130 L 150 106" fill="none" stroke="#9a8f74" stroke-width="1.2" />
        <line x1="100" y1="26" x2="100" y2="130" stroke="#9a8f74" stroke-width="1" />
        <rect y="112" width="200" height="28" [attr.fill]="'url(#' + hatchId + ')'" opacity="0.4" />
      </g>
    }

    @case ('identidad-escena') {
      <g>
        <rect width="200" height="140" fill="#0a0c14" />
        <circle cx="72" cy="56" r="18" fill="none" stroke="#6a614c" stroke-width="1.4" />
        <circle cx="128" cy="70" r="18" fill="none" stroke="#f3d28c" stroke-width="1.6" />
        <path d="M72 74 L72 112 M128 88 L128 112" fill="none" stroke="#d4af37" stroke-width="1.4"/>
        <path d="M96 34 L 96 62" stroke="#9a8f74" stroke-width="1.2" stroke-dasharray="3 4"/>
        <path d="M92 58 L 96 64 L 100 58" fill="none" stroke="#9a8f74" stroke-width="1.2"/>
        <rect y="112" width="200" height="28" [attr.fill]="'url(#' + hatchId + ')'" opacity="0.4" />
      </g>
    }

    @case ('remedio') {
      <g>
        <rect width="200" height="140" fill="#0a0c14" />
        <path d="M100 112 L 100 44" fill="none" stroke="#9a8f74" stroke-width="1.6"/>
        <path d="M100 44 L 128 62 L 100 62 Z" fill="none" stroke="#9a8f74" stroke-width="1.2"/>
        <circle cx="100" cy="120" r="16" fill="none" stroke="#6a614c" stroke-width="1.4"/>
        <path d="M124 96 A 34 34 0 1 1 138 84" fill="none" stroke="#f3d28c" stroke-width="1.6"/>
        <path d="M130 76 L 140 86 L 128 90 Z" fill="none" stroke="#f3d28c" stroke-width="1.4"/>
        <rect y="118" width="200" height="22" [attr.fill]="'url(#' + hatchId + ')'" opacity="0.4" />
      </g>
    }

    @default {
      <g>
        <rect width="200" height="140" fill="#0a0c14" />
        <circle cx="100" cy="70" r="24" fill="none" stroke="#f3d28c" stroke-width="1.2" />
      </g>
    }
  }
</svg>
