<div class="card" role="img" [attr.aria-label]="'Tu resultado: ' + data().natureLabel">
  <div class="backdrop"></div>

  <div class="frame">
    <header class="top">
      <span class="brand">BETWEEN</span>
      <span class="brand-sub">CRONICAS DE MADAR</span>
    </header>

    

    <div class="middle">
      <p class="kicker">La Diosa Luna te reconoce como</p>
      <h1 class="nature">{{ data().natureLabel }}</h1>
      <p class="meaning">{{ data().natureMeaning }}</p>
    </div>

    <footer class="bottom">
      <div class="facts">
        @if (data().kingdomName; as kingdom) {
          <span class="fact">
            <span class="fact-label">Reino</span>
            <span class="fact-value">{{ kingdom }}</span>
          </span>
        }
        @if (data().moonLabel; as moon) {
          <span class="fact">
            <span class="fact-label">Luna</span>
            <span class="fact-value">{{ moon }}</span>
          </span>
        }
        @if (data().founderName; as founder) {
          <span class="fact">
            <span class="fact-label">Legado de</span>
            <span class="fact-value">{{ founder }}</span>
          </span>
        }
      </div>
    <!-- Emblema de la naturaleza. Va arriba a la derecha, en la diagonal
             contraria a la marca, para equilibrar la composition. -->
        <svg class="emblem" viewBox="0 0 200 200" aria-hidden="true" focusable="false">
          @switch (data().nature) {
            @case ('cazut') {
              <g>
                <path d="M100 32 C100 32 58 92 58 124 a42 42 0 0 0 84 0 C142 92 100 32 100 32 Z"
                  fill="none" stroke="#c9922f" stroke-width="2.2" />
                <path d="M78 118 a22 22 0 0 0 16 24" fill="none" stroke="#f0d9a8" stroke-width="1.6" />
                <path d="M74 140 a30 30 0 0 0 12 16" fill="none" stroke="#8a6220" stroke-width="1.2" />
              </g>
            }
            @case ('diubak') {
              <g>
                <path d="M52 44 L64 20 L78 40 L100 34 L122 40 L136 20 L148 44 L146 84
                   a46 46 0 0 1 -92 0 Z" fill="none" stroke="#c9922f" stroke-width="2.2" />
                <circle cx="82" cy="82" r="5" fill="#f0d9a8" />
                <circle cx="118" cy="82" r="5" fill="#f0d9a8" />
                <path d="M100 96 l-8 12 l16 0 Z" fill="#c9922f" />
                <path d="M88 118 q12 10 24 0" fill="none" stroke="#f0d9a8" stroke-width="1.8" />
                <path d="M56 60 L40 48 M144 60 L160 48" fill="none" stroke="#8a6220" stroke-width="1.4" />
              </g>
            }
            @default {
              <g>
                <circle cx="100" cy="66" r="26" fill="none" stroke="#c9922f" stroke-width="2.2" />
                <path d="M100 94 L100 142" fill="none" stroke="#c9922f" stroke-width="2.2" />
                <path d="M100 108 L68 134 M100 108 L132 134" fill="none" stroke="#c9922f" stroke-width="2.2" />
                <path d="M100 142 L82 184 M100 142 L118 184" fill="none" stroke="#c9922f" stroke-width="2.2" />
                <path d="M86 60 a6 6 0 0 1 0.5 0 M114 60 a6 6 0 0 1 0.5 0"
                  fill="none" stroke="#8a6220" stroke-width="1.4" />
              </g>
            }
          }
        </svg>
    </footer>
  </div>
</div>
