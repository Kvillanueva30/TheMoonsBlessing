<!--
  Los seis reinos, antes de la fecha. Un carrusel, sin scroll vertical.

  Cara frontal: el rey de la guerra, en el marco.
  Cara trasera: el rey joven cuando fue nombrado por primera vez.
  El giro muestra el cambio.

  Los retratos se leen del canon, no de aqui: el HTML solo pide la imagen por
  su nombre y, si no existe, muestra el hueco con el nombre que falta.

  NO se muestran ni la naturaleza, ni la maldicion, ni la luz del fundador.
  Los tres reinos malditos declaran en sus datos que TODOS sus ciudadanos son
  Cazuts, y Bastia cuenta que Silas era el favorito de la diosa. Eso lo
  descubre el visitante durante el ritual, no antes.
-->

<!--
  Adornos del marco, definidos una sola vez. Se usan con <use>, y no
  repetidos dentro de cada card: son seis cards por dos caras, y escrito
  inline eran 48 SVG identicos en el DOM.

  Solo la esquina. La cresta del centro del borde se quito por decision de
  la autora: el rombo con su gema competia con el rostro y con el marco.
-->
<svg class="orn-defs" aria-hidden="true" focusable="false">
  <defs>
    <!-- Esquina del marco: moldura, dos volutas, una gema y dos muescas. -->
    <symbol id="madar-orn" viewBox="0 0 40 40">
      <path d="M1 39 V15 A14 14 0 0 1 15 1 H39" fill="none" stroke="#d4af37" stroke-width="1.3" />
      <path d="M7 39 C7 22 16 14 27 13" fill="none" stroke="#c9922f" stroke-width="1.1" />
      <path d="M13 39 C13 28 20 22 30 21" fill="none" stroke="#6e6242" stroke-width="1" />
      <circle cx="11" cy="11" r="2.6" fill="none" stroke="#f3d28c" stroke-width="1.2" />
      <path d="M18 6 H30 M6 18 V30" fill="none" stroke="#6e6242" stroke-width="1" />
    </symbol>
  </defs>
</svg>

<main class="kingdoms">
  <app-sky />

  <section class="intro">
    <h1 class="intro-title">Seis reinos</h1>
    <p class="intro-sub">Antes de tu luna, seis lugares te observan. Ninguno es el bueno.</p>
  </section>

  <!--
    El .reel envuelve a la pista y a las flechas. Las flechas NO pueden estar
    dentro de .stage: este tiene overflow:hidden para recortar el carril, y
    eso las recortaba a ellas tambien.
  -->
  <div class="reel">
    <div
      class="stage"
      (pointerdown)="onDown($event)"
      (pointerup)="onUp($event)"
      (pointercancel)="onUp($event)"
    >
      <ul class="track" [style.transform]="'translateX(-' + index() * 100 + '%)'">
        @for (k of kingdoms(); track k.id; let i = $index) {
          <li class="cell">
            <button
              type="button"
              class="card"
              [class.is-flipped]="isCurrent(i) && flipped()"
              [attr.aria-hidden]="!isCurrent(i)"
              [attr.tabindex]="isCurrent(i) ? 0 : -1"
              (click)="toggle()"
              [attr.aria-label]="'Ver ' + k.name + ', reino fundado por ' + (k.founder?.name ?? 'fundador sin nombre')"
            >
              <span class="card-inner">
                <!-- ============ CARA FRONTAL: el rey de la guerra ============ -->
                <span class="face face-front">
                  <span class="portrait">
                    <span class="lienzo">
                      <span class="frame" aria-hidden="true">
                        <svg class="orn orn-tl"><use href="#madar-orn" /></svg>
                        <svg class="orn orn-tr"><use href="#madar-orn" /></svg>
                        <svg class="orn orn-bl"><use href="#madar-orn" /></svg>
                        <svg class="orn orn-br"><use href="#madar-orn" /></svg>
                      </span>

                      @if (retrato(k.id, 'guerra'); as url) {
                        <img
                          class="retrato"
                          [src]="url"
                          [alt]="(k.founder?.name ?? '') + ' durante la guerra'"
                        />
                      } @else if (falta(k.id, 'guerra')) {
                        <span class="hueco">
                          <span class="hueco-nombre">{{ nombreArchivo(k.id, 'guerra') }}</span>
                          <span class="hueco-pista">retrato de la guerra</span>
                        </span>
                      }
                    </span>
                  </span>

                  <span class="founder">{{ k.founder?.name ?? '—' }}</span>
                  <span class="realm">{{ k.name }}</span>
                  <span class="hint">voltea</span>
                </span>

                <!-- ============ CARA TRASERA: el rey joven ============ -->
                <span class="face face-back">
                  <span class="portrait">
                    <span class="lienzo">
                      <span class="frame" aria-hidden="true">
                        <svg class="orn orn-tl"><use href="#madar-orn" /></svg>
                        <svg class="orn orn-tr"><use href="#madar-orn" /></svg>
                        <svg class="orn orn-bl"><use href="#madar-orn" /></svg>
                        <svg class="orn orn-br"><use href="#madar-orn" /></svg>
                      </span>

                      @if (retrato(k.id, 'joven'); as url) {
                        <img
                          class="retrato"
                          [src]="url"
                          [alt]="(k.founder?.name ?? '') + ' joven, al ser nombrado rey'"
                        />
                      } @else if (falta(k.id, 'joven')) {
                        <span class="hueco">
                          <span class="hueco-nombre">{{ nombreArchivo(k.id, 'joven') }}</span>
                          <span class="hueco-pista">el joven nombrado rey</span>
                        </span>
                      }
                    </span>
                  </span>

                  <!--
                    La essence va en una banda encima del retrato. Es una
                    decision provisional: la location no se ha cerrado, y esta
                    es la que deja el giro util sin tapar la imagen.
                  -->
                  <span class="essence">{{ k.essence?.es }}</span>
                </span>
              </span>
            </button>
          </li>
        }
      </ul>
    </div>

    <button type="button" class="arrow arrow-prev" (click)="prev()" aria-label="El reino anterior">
      <span aria-hidden="true">‹</span>
    </button>
    <button type="button" class="arrow arrow-next" (click)="next()" aria-label="El reino siguiente">
      <span aria-hidden="true">›</span>
    </button>
  </div>

  <!-- Puntos de luz. Sin numeros, igual que el sendero de las preguntas. -->
  <ul class="dots">
    @for (k of kingdoms(); track k.id; let i = $index) {
      <li>
        <button
          type="button"
          class="dot"
          [class.now]="isCurrent(i)"
          (click)="goTo(i)"
          [attr.aria-label]="'Ver ' + k.name"
          [attr.aria-current]="isCurrent(i) ? 'true' : null"
        ></button>
      </li>
    }
  </ul>

  <p class="hint-touch">Pasa el cursor. En el movil, desliza y toca.</p>

  <a class="btn" routerLink="/birth-date">Continuar</a>
</main>
