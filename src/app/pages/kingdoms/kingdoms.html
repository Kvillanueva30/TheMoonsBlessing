<!--
  Los seis reinos, antes de la fecha. Un carrusel, sin scroll vertical.

  Cara frontal: silueta del fundador y su nombre. No hay retrato porque no
  existe arte de los fundadores y AGENTS.md deja la imagen por IA fuera de
  alcance. La silueta es un hueco honesto: cuando llegue el arte se cambia el
  fondo de esta cara y no el resto.

  Cara trasera: SOLO la esencia. Ni naturaleza, ni maldicion, ni lista de
  valores. Es un anzuelo, no una ficha. El porque esta en kingdoms.ts.
-->
<main class="kingdoms">
  <app-sky />

  <section class="intro">
    <h1 class="intro-title">Seis reinos</h1>
    <p class="intro-sub">Antes de tu luna, seis lugares te observan. Ninguno es el bueno.</p>
  </section>

  <!--
    El .reel envuelve a la pista y a las flechas. Las flechas NO pueden estar
    dentro de .stage: este tiene overflow:hidden para recortar el carril, y
    eso las recortaba a ellas tambien. Medido: quedaban en 246-292 y 708-754
    con la pista en 292-708, o sea enteras fuera.
  -->
  <div class="reel">
    <div
      class="stage"
      (pointerdown)="onDown($event)"
      (pointerup)="onUp($event)"
      (pointercancel)="onUp($event)"
    >
      <ul class="track" [style.transform]="'translateX(-' + index() * 100 + '%)'">
        @for (k of kingdoms(); track k.id; let i = $index) {
          <li class="cell">
            <button
              type="button"
              class="card"
              [class.is-flipped]="isCurrent(i) && flipped()"
              [attr.aria-hidden]="!isCurrent(i)"
              [attr.tabindex]="isCurrent(i) ? 0 : -1"
              (click)="toggle()"
              [attr.aria-label]="'Ver ' + k.name + ', reino fundado por ' + (k.founder?.name ?? 'fundador sin nombre')"
            >
              <span class="card-inner">
                <!-- CARA FRONTAL: la silueta. -->
                <span class="face face-front">
                  <svg class="silhouette" viewBox="0 0 100 110" aria-hidden="true" focusable="false">
                    <defs>
                      <pattern
                        [attr.id]="uid(i)"
                        width="3"
                        height="3"
                        patternUnits="userSpaceOnUse"
                        patternTransform="rotate(45)"
                      >
                        <line x1="0" y1="0" x2="0" y2="3" stroke="#d4af37" stroke-width="0.5" />
                      </pattern>
                    </defs>
                    <path d="M50 16 a15 17 0 1 1 -0.1 0 Z" fill="none" stroke="#f3d28c" stroke-width="1.2" />
                    <path d="M50 33 L50 46" stroke="#9a8f74" stroke-width="1.1" />
                    <path d="M18 96 Q 26 58, 50 58 Q 74 58, 82 96 Z" fill="none" stroke="#f3d28c" stroke-width="1.3" />
                    <path d="M50 58 L50 96" stroke="#6a614c" stroke-width="0.9" />
                    <rect y="96" width="100" height="14" [attr.fill]="'url(#' + uid(i) + ')'" opacity="0.35" />
                  </svg>

                  <span class="founder">{{ k.founder?.name ?? '—' }}</span>
                  <span class="realm">{{ k.name }}</span>
                  <span class="hint">voltea</span>
                </span>

                <!-- CARA TRASERA: una frase. Nada mas. -->
                <span class="face face-back">
                  <span class="back-essence">{{ k.essence?.es }}</span>
                  <span class="back-realm">{{ k.name }}</span>
                </span>
              </span>
            </button>
          </li>
        }
      </ul>
    </div>

    <button type="button" class="arrow arrow-prev" (click)="prev()" aria-label="El reino anterior">
      <span aria-hidden="true">‹</span>
    </button>
    <button type="button" class="arrow arrow-next" (click)="next()" aria-label="El reino siguiente">
      <span aria-hidden="true">›</span>
    </button>
  </div>

  <!-- Puntos de luz. Sin numeros, igual que el sendero de las preguntas. -->
  <ul class="dots">
    @for (k of kingdoms(); track k.id; let i = $index) {
      <li>
        <button
          type="button"
          class="dot"
          [class.now]="isCurrent(i)"
          (click)="goTo(i)"
          [attr.aria-label]="'Ver ' + k.name"
          [attr.aria-current]="isCurrent(i) ? 'true' : null"
        ></button>
      </li>
    }
  </ul>

  <p class="hint-touch">Pasa el cursor. En el movil, desliza y toca.</p>

  <a class="btn" routerLink="/birth-date">Continuar</a>
</main>
