<main class="moon-reveal">
  <app-sky />

  <section class="content">
    @if (phase; as p) {
      <app-moon [phase]="p" class="reveal-moon" />
    }

    <p class="eyebrow">Tu fase lunar</p>
    <h1>{{ phaseLabel }}</h1>
    <p class="hint">Este es el aspecto del cielo el día en que naciste.</p>

    <a
      [routerLink]="['/questions']"
      [queryParams]="{ y: year, m: month, d: day }"
      class="continue"
      >Continuar</a
    >
  </section>
</main>
