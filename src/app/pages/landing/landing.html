<main class="landing">
  <canvas id="stars"></canvas>
  <div class="nebula" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <section class="stage">
    <!-- Elemento dominante de la portada: la luna, con la fase del día real -->
    <app-moon [phase]="today" />

    <h1 class="title">{{ name }}</h1>
    <p class="tagline">{{ tagline }}</p>

    <div class="cta-row">
      <a class="btn" routerLink="/birth-date">{{ cta }}</a>
    </div>
  </section>

  <footer class="credit">
    <span class="credit-label">Autora</span>
    <span class="credit-name">Karla Villanueva</span>
  </footer>
</main>
