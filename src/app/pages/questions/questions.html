<main class="page">
  <app-sky />

  @if (questions().length === 0) {
    <div class="state">
      <p class="breath">La noche está mirando.</p>
    </div>
  } @else if (current(); as question) {
    <section class="stage" [class.alt]="index() % 2 === 1" [class.last]="isLast()">
      <div class="head">
        <app-etching [theme]="etching()" />
        <div class="head-text">
          <ol class="trail" aria-hidden="true">
            @for (dot of dots(); track $index) {
              <li [class.done]="dot.done" [class.now]="dot.now"></li>
            }
          </ol>

          <p class="eyebrow">{{ question.theme }}</p>
          <h1 class="dilemma">{{ question.text }}</h1>
        </div>
      </div>

      <ul class="choices" role="radiogroup" [attr.aria-label]="question.theme">
        @for (option of options(); track option.id) {
          <li>
            <button
              type="button"
              role="radio"
              [attr.aria-checked]="chosen() === option.id"
              [class.picked]="chosen() === option.id"
              (click)="choose(option.id)"
            >
              <span class="mark" aria-hidden="true"></span>
              <span class="text">{{ option.text }}</span>
            </button>
          </li>
        }
      </ul>

      <div class="controls">
        <button type="button" class="ghost" [disabled]="index() === 0" (click)="back()">
          Atrás
        </button>
        <button type="button" class="primary" [disabled]="!chosen()" (click)="next()">
          {{ isLast() ? 'Que te miren' : 'Continuar' }}
        </button>
      </div>
    </section>
  }
</main>
