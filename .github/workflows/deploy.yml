name: Deploy to GitHub Pages

# Cada push a main genera un build y despliega en GitHub Pages.
# No hay despliegue manual.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Solo un despliegue a la vez. Si llega un push nuevo, cancela el anterior.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Version fijada segun el brief del proyecto.
          node-version: '22.14.0'
          cache: npm

      - run: npm ci

      - name: Build
        # El repositorio se publica en <usuario>.github.io/<repositorio>/,
        # por lo que el base href debe incluir el nombre del repositorio.
        run: npx ng build --base-href "/${{ github.event.repository.name }}/"

      - name: Fallback SPA
        # GitHub Pages no rewrite de rutas: si alguien recarga en
        # /birth-date o /result, el servidor devuelve 404. Copiar el index
        # como 404.html hace que Pages lo sirva y Angular enrute en cliente.
        run: cp dist/madar/browser/index.html dist/madar/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/madar/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
